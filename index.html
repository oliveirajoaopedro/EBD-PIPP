<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBD - PIPP Acesso Restrito</title>

    <!-- Rastreador de carregamento: marca cada biblioteca que NAO carregou -->
    <script>
        window.__falhasDeCarregamento = [];
        window.__erroDeExecucao = null;
        window.onerror = function (msg, src, lin, col, err) {
            window.__erroDeExecucao = (err && err.stack) ? err.stack : (msg + ' (' + src + ':' + lin + ')');
        };
    </script>

    <!-- Bibliotecas externas (versoes fixadas = mais estavel que @latest) -->
    <script src="https://cdn.tailwindcss.com"
            onerror="window.__falhasDeCarregamento.push('Tailwind (estilos) — cdn.tailwindcss.com')"></script>

    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
            onerror="window.__falhasDeCarregamento.push('React — unpkg.com')"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
            onerror="window.__falhasDeCarregamento.push('React DOM — unpkg.com')"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"
            onerror="window.__falhasDeCarregamento.push('Babel (traduz o codigo) — unpkg.com')"></script>

    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"
            onerror="window.__falhasDeCarregamento.push('Lucide (icones) — unpkg.com')"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
            onerror="window.__falhasDeCarregamento.push('Chart.js (graficos) — cdn.jsdelivr.net')"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #4f46e5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
    </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        // ==========================================================
        // *** IMPORTANTE: COLOQUE SUA URL AQUI ***
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqe2CmqgBBNaL90jnyUBndfsGYSejfqL_C4v60UyeIoQktKGjIG6XFVQPCya4NKrn-nw/exec";
        // ==========================================================

        const TURMAS = [
            'infantil-1-3',
            'infantil-4-6',
            'infantil-7-11',
            'infantil-aras',
            'adolescentes',
            'adultos-catecumenos',
            'adultos-discipulado'
        ];

        const { useState, useEffect, useRef, useMemo } = React;

        // Formata "yyyy-MM-dd" para "dd/mm" (rótulo curto pra eixo de gráfico)
        const formatarDataCurta = (dataKey) => {
            if (!dataKey) return '';
            const partes = dataKey.split('-');
            return partes.length === 3 ? `${partes[2]}/${partes[1]}` : dataKey;
        };

        // Banner de aviso quando o backend (Apps Script) ainda não manda um campo novo
        const AvisoBackend = ({ texto }) => (
            <div className="bg-amber-50 text-amber-700 border border-amber-100 rounded-2xl p-4 flex items-center gap-3 text-sm font-medium">
                <Icon name="alert-triangle" className="w-5 h-5 flex-shrink-0" />
                <span>{texto}</span>
            </div>
        );

        // Aviso neutro (sem dado ainda, mas a estrutura já existe)
        const AvisoVazio = ({ texto }) => (
            <div className="text-center text-slate-400 text-sm font-medium py-8">{texto}</div>
        );

        // ==========================================================
        // COMPONENTE DE ÍCONE BLINDADO
        // ==========================================================
        const Icon = ({ name, className }) => {
            try {
                const iconName = useMemo(() => {
                    if(!name) return "";
                    return name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                }, [name]);

                const svgHtml = useMemo(() => {
                    if (window.lucide && window.lucide.icons && window.lucide.icons[iconName]) {
                        return window.lucide.icons[iconName].toSvg({ class: className });
                    }
                    return null;
                }, [iconName, className]);

                if (!svgHtml) return <span className="inline-block w-4 h-4 bg-gray-200 rounded-full opacity-50"></span>;
                return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="inline-flex items-center justify-center" />;
            } catch (e) {
                return <span></span>;
            }
        };

        // ==========================================================
        // TELA DE LOGIN
        // ==========================================================
        const LoginScreen = ({ onLogin }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (user.toUpperCase() === 'PIPPEBD' && pass === '@1934') {
                    onLogin();
                } else {
                    setError('Acesso negado. Verifique os dados.');
                    setPass('');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100 fade-in">
                        <div className="text-center mb-8">
                            <div className="bg-indigo-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-600">
                                <Icon name="lock" className="w-8 h-8" />
                            </div>
                            <h1 className="text-2xl font-black text-slate-800">Área Restrita</h1>
                            <p className="text-slate-400 text-sm mt-1">Acesso exclusivo para professores</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Usuário</label>
                                <div className="relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="user" className="w-4 h-4"/></div>
                                    <input
                                        type="text"
                                        value={user}
                                        onChange={(e) => setUser(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Digite seu usuário"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Senha</label>
                                <div className="relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="key" className="w-4 h-4"/></div>
                                    <input
                                        type="password"
                                        value={pass}
                                        onChange={(e) => setPass(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Digite sua senha"
                                    />
                                </div>
                            </div>

                            {error && (
                                <div className="bg-red-50 text-red-600 text-sm p-3 rounded-xl flex items-center gap-2 font-medium">
                                    <Icon name="alert-circle" className="w-4 h-4" />
                                    {error}
                                </div>
                            )}

                            <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-indigo-700 transition-all transform active:scale-[0.98] mt-4 flex justify-center items-center gap-2">
                                Entrar no Sistema <Icon name="arrow-right" className="w-4 h-4" />
                            </button>
                        </form>

                        <div className="mt-8 text-center border-t border-slate-100 pt-6">
                            <p className="text-xs text-slate-300 font-bold uppercase tracking-widest">PIPP EBD 2026</p>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================================
        // APP PRINCIPAL (CORRIGIDO)
        // ==========================================================
        const App = () => {
            // ESTADOS (Hooks devem ficar sempre no topo)
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('chamada');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);

            const [formData, setFormData] = useState({
                professor: '',
                dataAula: new Date().toISOString().split('T')[0],
                ano: 2026,
                semestre: 1,
                turma: ''
            });

            const [alunos, setAlunos] = useState([]);
            const [dashboardData, setDashboardData] = useState(null);
            const [turmaFiltro, setTurmaFiltro] = useState(TURMAS[0]);
            const [dataInicio, setDataInicio] = useState('');
            const [dataFim, setDataFim] = useState('');

            const [turmaGerenciar, setTurmaGerenciar] = useState('');
            const [gerenciamento, setGerenciamento] = useState(null);
            const [novoAlunoNome, setNovoAlunoNome] = useState('');
            const [loadingGerenciamento, setLoadingGerenciamento] = useState(false);

            const chartGeralRef = useRef(null);
            const chartGeralInstance = useRef(null);
            const chartRankingRef = useRef(null);
            const chartRankingInstance = useRef(null);
            const chartTurmaRef = useRef(null);
            const chartTurmaInstance = useRef(null);

            // FUNÇÕES DE LÓGICA
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                if (name === 'turma') setAlunos([]);
            };

            const carregarAlunos = async () => {
                if (!formData.turma) {
                    setMessage({ type: 'error', text: 'Selecione uma turma.' });
                    return;
                }

                setLoading(true);
                setMessage(null);
                setAlunos([]);

                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "buscar_alunos", turma: formData.turma })
                    });

                    const data = await res.json();

                    if (data.alunos && Array.isArray(data.alunos)) {
                        if (data.alunos.length > 0) {
                            setAlunos(data.alunos.map(nome => ({ nome, presente: true })));
                        } else {
                            setMessage({ type: 'info', text: 'Nenhum aluno nesta turma.' });
                        }
                    } else {
                         setMessage({ type: 'info', text: 'Nenhum dado encontrado ou erro.' });
                    }
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoading(false);
                }
            };

            const togglePresenca = (index) => {
                setAlunos(prev => prev.map((aluno, i) =>
                    i === index ? { ...aluno, presente: !aluno.presente } : aluno
                ));
            };

            const salvarChamada = async () => {
                if (!formData.professor) {
                    setMessage({ type: 'error', text: 'Preencha o nome do professor.' });
                    return;
                }

                setLoading(true);
                setMessage({ type: 'info', text: 'Salvando...' });

                const payload = {
                    action: "salvar_chamada",
                    ...formData,
                    listaPresenca: alunos.map(a => ({
                        aluno: a.nome,
                        status: a.presente ? "Presente" : "Ausente"
                    }))
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    setMessage({ type: 'success', text: 'Chamada Salva!' });
                    setAlunos([]);
                    setFormData(prev => ({...prev, turma: ''}));
                    setTimeout(() => setMessage(null), 3000);
                } catch (error) {
                    setMessage({ type: 'error', text: 'Erro ao salvar.' });
                } finally {
                    setLoading(false);
                }
            };

            const carregarDashboard = async () => {
                setLoading(true);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "get_dashboard" })
                    });
                    const data = await res.json();
                    if(data.result === 'success') setDashboardData(data);
                } catch (error) {
                    console.error(error);
                } finally {
                    setLoading(false);
                }
            };

            const carregarGerenciamento = async (turma) => {
                if (!turma) return;
                setLoadingGerenciamento(true);
                setMessage(null);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "get_gerenciamento_turma", turma })
                    });
                    const data = await res.json();
                    if (data.result === 'success') {
                        setGerenciamento(data);
                    } else {
                        setMessage({ type: 'error', text: data.error || 'Erro ao carregar turma.' });
                    }
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoadingGerenciamento(false);
                }
            };

            const matricularAluno = async () => {
                const nome = novoAlunoNome.trim();
                if (!turmaGerenciar || !nome) {
                    setMessage({ type: 'error', text: 'Digite o nome do aluno.' });
                    return;
                }
                setLoadingGerenciamento(true);
                setMessage(null);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "matricular_aluno", turma: turmaGerenciar, nomeAluno: nome })
                    });
                    const data = await res.json();
                    if (data.result === 'success') {
                        setMessage({ type: 'success', text: data.acao === 'reativado' ? 'Aluno reativado nesta turma!' : 'Aluno matriculado!' });
                        setNovoAlunoNome('');
                        await carregarGerenciamento(turmaGerenciar);
                    } else {
                        setMessage({ type: 'error', text: data.error || 'Erro ao matricular aluno.' });
                    }
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoadingGerenciamento(false);
                }
            };

            const desmatricularAluno = async (nome) => {
                if (!window.confirm(`Remover "${nome}" desta turma? O histórico de chamadas dele é mantido.`)) return;
                setLoadingGerenciamento(true);
                setMessage(null);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "desmatricular_aluno", turma: turmaGerenciar, nomeAluno: nome })
                    });
                    const data = await res.json();
                    if (data.result === 'success') {
                        setMessage({ type: 'success', text: 'Aluno removido da turma.' });
                        await carregarGerenciamento(turmaGerenciar);
                    } else {
                        setMessage({ type: 'error', text: data.error || 'Erro ao remover aluno.' });
                    }
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoadingGerenciamento(false);
                }
            };

            // --- VALORES DERIVADOS (memorizados) ---

            // true se a data (yyyy-MM-dd) está dentro do intervalo escolhido pelo professor
            const dentroIntervalo = (dataKey) => {
                if (dataInicio && dataKey < dataInicio) return false;
                if (dataFim && dataKey > dataFim) return false;
                return true;
            };

            const historicoGeralFiltrado = useMemo(() => {
                if (!dashboardData || !dashboardData.historicoGeral) return dashboardData ? dashboardData.historicoGeral : undefined;
                return dashboardData.historicoGeral.filter(h => dentroIntervalo(h.data));
            }, [dashboardData, dataInicio, dataFim]);

            const historicoTurmaFiltrado = useMemo(() => {
                const historico = dashboardData && dashboardData.historicoPorTurma && dashboardData.historicoPorTurma[turmaFiltro];
                if (!historico) return historico;
                return historico.filter(h => dentroIntervalo(h.data));
            }, [dashboardData, turmaFiltro, dataInicio, dataFim]);

            const totaisGerais = useMemo(() => {
                if (dashboardData && dashboardData.historicoGeral) {
                    let presentes = 0, ausentes = 0, total = 0;
                    (historicoGeralFiltrado || []).forEach(h => { presentes += h.presentes; ausentes += h.ausentes; total += h.total; });
                    return { presentes, ausentes, total };
                }
                // Backend antigo sem historicoGeral: usa os totais agregados (sem filtro de data)
                if (!dashboardData || !dashboardData.statsPorTurma) return { presentes: 0, ausentes: 0, total: 0 };
                let presentes = 0, ausentes = 0, total = 0;
                Object.values(dashboardData.statsPorTurma).forEach(s => {
                    presentes += s.presentes; ausentes += s.ausentes; total += s.total;
                });
                return { presentes, ausentes, total };
            }, [dashboardData, historicoGeralFiltrado]);

            const rankingTurmas = useMemo(() => {
                if (!dashboardData || !dashboardData.statsPorTurma) return [];
                return Object.keys(dashboardData.statsPorTurma).map(turma => {
                    const s = dashboardData.statsPorTurma[turma];
                    const historicoTurma = dashboardData.historicoPorTurma && dashboardData.historicoPorTurma[turma];

                    if (historicoTurma) {
                        const filtrado = historicoTurma.filter(h => dentroIntervalo(h.data));
                        let presentes = 0, ausentes = 0, total = 0;
                        filtrado.forEach(h => { presentes += h.presentes; ausentes += h.ausentes; total += h.total; });
                        return {
                            turma,
                            alunos: s.alunos,
                            total,
                            domingosRegistrados: filtrado.length,
                            percentual: total > 0 ? (presentes / total * 100) : 0
                        };
                    }

                    // Backend antigo sem historicoPorTurma: usa os totais agregados (sem filtro de data)
                    return {
                        turma,
                        alunos: s.alunos,
                        total: s.total,
                        domingosRegistrados: 0,
                        percentual: s.total > 0 ? (s.presentes / s.total * 100) : 0
                    };
                }).sort((a, b) => b.percentual - a.percentual);
            }, [dashboardData, dataInicio, dataFim]);

            const mapaFaltasPivot = useMemo(() => {
                if (!dashboardData || !dashboardData.mapaAlunosPorTurma) return null;
                const registros = dashboardData.mapaAlunosPorTurma[turmaFiltro];
                if (!registros) return { alunosList: [], datasList: [], statusMap: {} };

                const alunosSet = new Set();
                const datasSet = new Set();
                const statusMap = {};
                registros.filter(r => dentroIntervalo(r.data)).forEach(r => {
                    alunosSet.add(r.aluno);
                    datasSet.add(r.data);
                    statusMap[`${r.aluno}|${r.data}`] = r.status;
                });
                return {
                    alunosList: Array.from(alunosSet).sort(),
                    datasList: Array.from(datasSet).sort(),
                    statusMap
                };
            }, [dashboardData, turmaFiltro, dataInicio, dataFim]);

            // --- HOOKS (EFEITOS) NO TOPO ---
            // IMPORTANTE: Eles devem ser declarados ANTES de qualquer "return"

            useEffect(() => {
                // Só carrega dashboard se estiver logado e na aba certa
                if (isLoggedIn && activeTab === 'dashboard') {
                    carregarDashboard();
                }
            }, [activeTab, isLoggedIn]);

            useEffect(() => {
                if (isLoggedIn && activeTab === 'turma' && turmaGerenciar) {
                    carregarGerenciamento(turmaGerenciar);
                }
            }, [activeTab, turmaGerenciar, isLoggedIn]);

            // Gráfico: Evolução Geral por Domingo (linha % + barras de total)
            useEffect(() => {
                const historico = historicoGeralFiltrado;
                if (isLoggedIn && activeTab === 'dashboard' && historico && historico.length > 0 && chartGeralRef.current) {
                    if (chartGeralInstance.current) chartGeralInstance.current.destroy();

                    const labels = historico.map(h => formatarDataCurta(h.data));
                    const percentuais = historico.map(h => h.total > 0 ? +(h.presentes / h.total * 100).toFixed(1) : 0);
                    const totais = historico.map(h => h.total);

                    chartGeralInstance.current = new Chart(chartGeralRef.current, {
                        data: {
                            labels,
                            datasets: [
                                { type: 'bar', label: 'Total de Chamadas', data: totais, backgroundColor: '#c7d2fe', borderRadius: 4, yAxisID: 'yTotal', order: 2 },
                                { type: 'line', label: '% Presença', data: percentuais, borderColor: '#4f46e5', backgroundColor: '#4f46e5', tension: 0.3, yAxisID: 'yPct', order: 1 }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            scales: {
                                yPct: { type: 'linear', position: 'left', min: 0, max: 100, ticks: { callback: v => v + '%' } },
                                yTotal: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
                            }
                        }
                    });
                }
            }, [historicoGeralFiltrado, activeTab, isLoggedIn]);

            // Gráfico: Ranking de Turmas (barras horizontais por % de presença)
            useEffect(() => {
                if (isLoggedIn && activeTab === 'dashboard' && rankingTurmas.length > 0 && chartRankingRef.current) {
                    if (chartRankingInstance.current) chartRankingInstance.current.destroy();

                    chartRankingInstance.current = new Chart(chartRankingRef.current, {
                        type: 'bar',
                        data: {
                            labels: rankingTurmas.map(r => r.turma),
                            datasets: [{
                                label: '% Presença',
                                data: rankingTurmas.map(r => +r.percentual.toFixed(1)),
                                backgroundColor: '#4f46e5',
                                borderRadius: 5
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: { x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } },
                            plugins: {
                                tooltip: {
                                    callbacks: {
                                        afterLabel: (ctx) => `${rankingTurmas[ctx.dataIndex].alunos} alunos ativos`
                                    }
                                }
                            }
                        }
                    });
                }
            }, [rankingTurmas, activeTab, isLoggedIn]);

            // Gráfico: Evolução por Turma (filtrado por turma e por intervalo de datas)
            useEffect(() => {
                const historico = historicoTurmaFiltrado;
                if (isLoggedIn && activeTab === 'dashboard' && historico && historico.length > 0 && chartTurmaRef.current) {
                    if (chartTurmaInstance.current) chartTurmaInstance.current.destroy();

                    const labels = historico.map(h => formatarDataCurta(h.data));
                    const percentuais = historico.map(h => h.total > 0 ? +(h.presentes / h.total * 100).toFixed(1) : 0);
                    const totais = historico.map(h => h.total);

                    chartTurmaInstance.current = new Chart(chartTurmaRef.current, {
                        data: {
                            labels,
                            datasets: [
                                { type: 'bar', label: 'Total de Chamadas', data: totais, backgroundColor: '#a7f3d0', borderRadius: 4, yAxisID: 'yTotal', order: 2 },
                                { type: 'line', label: '% Presença', data: percentuais, borderColor: '#059669', backgroundColor: '#059669', tension: 0.3, yAxisID: 'yPct', order: 1 }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            scales: {
                                yPct: { type: 'linear', position: 'left', min: 0, max: 100, ticks: { callback: v => v + '%' } },

    <!-- DETECTOR DE TELA BRANCA: roda em JS puro (nao depende do Babel/React) -->
    <script>
        function mostrarDiagnostico() {
            var root = document.getElementById('root');
            if (root && root.children.length > 0) return; // app montou: nada a fazer

            var faltando = [];
            if (typeof React === 'undefined') faltando.push('React');
            if (typeof ReactDOM === 'undefined') faltando.push('React DOM');
            if (typeof Babel === 'undefined') faltando.push('Babel');

            var msg = '';
            if (window.__falhasDeCarregamento && window.__falhasDeCarregamento.length) {
                msg += '<p><strong>Estas bibliotecas nao carregaram:</strong></p><ul style="margin:8px 0 0 18px">';
                window.__falhasDeCarregamento.forEach(function (f) { msg += '<li>' + f + '</li>'; });
                msg += '</ul>';
            } else if (faltando.length) {
                msg += '<p><strong>Bibliotecas indisponiveis:</strong> ' + faltando.join(', ') + '</p>';
            }
            if (window.__erroDeExecucao) {
                msg += '<p style="margin-top:12px"><strong>Erro de execucao:</strong></p>'
                     + '<pre style="white-space:pre-wrap;background:#0f172a;color:#fca5a5;padding:12px;border-radius:8px;font-size:12px;overflow:auto">'
                     + String(window.__erroDeExecucao).replace(/</g, '&lt;') + '</pre>';
            }
            if (!msg) {
                msg = '<p>Os scripts demoraram demais para responder ou foram bloqueados.</p>';
            }

            root.innerHTML =
                '<div style="max-width:640px;margin:48px auto;padding:28px;font-family:system-ui,sans-serif;'
              + 'background:#fff;border:1px solid #e2e8f0;border-left:6px solid #dc2626;border-radius:16px;'
              + 'box-shadow:0 10px 30px rgba(0,0,0,.06);color:#1e293b">'
              + '<h2 style="margin:0 0 6px;color:#dc2626;font-size:18px">Nao foi possivel carregar a pagina</h2>'
              + '<p style="margin:0 0 14px;color:#64748b;font-size:14px">O codigo esta correto, mas os recursos abaixo nao puderam ser baixados:</p>'
              + msg
              + '<p style="margin-top:18px;font-size:13px;color:#475569"><strong>Como resolver:</strong></p>'
              + '<ul style="margin:6px 0 0 18px;font-size:13px;color:#475569;line-height:1.6">'
              + '<li>Verifique sua conexao com a internet e recarregue (F5).</li>'
              + '<li>Desative bloqueadores de anuncios/scripts para esta pagina.</li>'
              + '<li>Em rede corporativa/escolar, o acesso a <code>unpkg.com</code> ou <code>jsdelivr.net</code> pode estar bloqueado — tente outra rede.</li>'
              + '</ul></div>';
        }
        window.addEventListener('load', function () { setTimeout(mostrarDiagnostico, 2500); });
    </script>
</body>
</html>
