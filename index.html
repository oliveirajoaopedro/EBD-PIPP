<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBD - PIPP Acesso Restrito</title>

    <!-- Rastreador de carregamento: marca cada biblioteca que NAO carregou -->
    <script>
        window.__falhasDeCarregamento = [];
        window.__erroDeExecucao = null;
        window.onerror = function (msg, src, lin, col, err) {
            window.__erroDeExecucao = (err && err.stack) ? err.stack : (msg + ' (' + src + ':' + lin + ')');
        };
    </script>

    <!-- Bibliotecas externas (versoes fixadas = mais estavel que @latest) -->
    <script src="https://cdn.tailwindcss.com"
            onerror="window.__falhasDeCarregamento.push('Tailwind (estilos) - cdn.tailwindcss.com')"></script>

    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
            onerror="window.__falhasDeCarregamento.push('React - unpkg.com')"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
            onerror="window.__falhasDeCarregamento.push('React DOM - unpkg.com')"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"
            onerror="window.__falhasDeCarregamento.push('Babel (traduz o codigo) - unpkg.com')"></script>

    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"
            onerror="window.__falhasDeCarregamento.push('Lucide (icones) - unpkg.com')"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
            onerror="window.__falhasDeCarregamento.push('Chart.js (graficos) - cdn.jsdelivr.net')"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #4f46e5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
    </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        // ==========================================================
        // *** IMPORTANTE: COLOQUE SUA URL AQUI ***
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqe2CmqgBBNaL90jnyUBndfsGYSejfqL_C4v60UyeIoQktKGjIG6XFVQPCya4NKrn-nw/exec";
        // ==========================================================

        const TURMAS = [
            'infantil-1-3',
            'infantil-4-6',
            'infantil-7-11',
            'infantil-aras',
            'adolescentes',
            'adultos-catecumenos',
            'adultos-discipulado'
        ];

        const { useState, useEffect, useRef, useMemo } = React;

        // Formata "yyyy-MM-dd" para "dd/mm" (rótulo curto pra eixo de gráfico)
        const formatarDataCurta = (dataKey) => {
            if (!dataKey) return '';
            const partes = dataKey.split('-');
            return partes.length === 3 ? `${partes[2]}/${partes[1]}` : dataKey;
        };

        // Banner de aviso quando o backend (Apps Script) ainda não manda um campo novo
        const AvisoBackend = ({ texto }) => (
            <div className="bg-amber-50 text-amber-700 border border-amber-100 rounded-2xl p-4 flex items-center gap-3 text-sm font-medium">
                <Icon name="alert-triangle" className="w-5 h-5 flex-shrink-0" />
                <span>{texto}</span>
            </div>
        );

        // Aviso neutro (sem dado ainda, mas a estrutura já existe)
        const AvisoVazio = ({ texto }) => (
            <div className="text-center text-slate-400 text-sm font-medium py-8">{texto}</div>
        );

        // ==========================================================
        // COMPONENTE DE ÍCONE BLINDADO
        // ==========================================================
        const Icon = ({ name, className }) => {
            try {
                const iconName = useMemo(() => {
                    if(!name) return "";
                    return name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                }, [name]);

                const svgHtml = useMemo(() => {
                    if (window.lucide && window.lucide.icons && window.lucide.icons[iconName]) {
                        return window.lucide.icons[iconName].toSvg({ class: className });
                    }
                    return null;
                }, [iconName, className]);

                if (!svgHtml) return <span className="inline-block w-4 h-4 bg-gray-200 rounded-full opacity-50"></span>;
                return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="inline-flex items-center justify-center" />;
            } catch (e) {
                return <span></span>;
            }
        };

        // ==========================================================
        // TELA DE LOGIN
        // ==========================================================
        const LoginScreen = ({ onLogin }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (user.toUpperCase() === 'PIPPEBD' && pass === '@1934') {
                    onLogin();
                } else {
                    setError('Acesso negado. Verifique os dados.');
                    setPass('');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100 fade-in">
                        <div className="text-center mb-8">
                            <div className="bg-indigo-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-600">
                                <Icon name="lock" className="w-8 h-8" />
                            </div>
                            <h1 className="text-2xl font-black text-slate-800">Área Restrita</h1>
                            <p className="text-slate-400 text-sm mt-1">Acesso exclusivo para professores</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Usuário</label>
                                <div className="relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="user" className="w-4 h-4"/></div>
                                    <input
                                        type="text"
                                        value={user}
                                        onChange={(e) => setUser(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Digite seu usuário"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Senha</label>
                                <div className="relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="key" className="w-4 h-4"/></div>
                                    <input
                                        type="password"
                                        value={pass}
                                        onChange={(e) => setPass(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Digite sua senha"
                                    />
                                </div>
                            </div>

                            {error && (
                                <div className="bg-red-50 text-red-600 text-sm p-3 rounded-xl flex items-center gap-2 font-medium">
                                    <Icon name="alert-circle" className="w-4 h-4" />
                                    {error}
                                </div>
                            )}

                            <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-indigo-700 transition-all transform active:scale-[0.98] mt-4 flex justify-center items-center gap-2">
                                Entrar no Sistema <Icon name="arrow-right" className="w-4 h-4" />
                            </button>
                        </form>

                        <div className="mt-8 text-center border-t border-slate-100 pt-6">
                            <p className="text-xs text-slate-300 font-bold uppercase tracking-widest">PIPP EBD 2026</p>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================================
        // APP PRINCIPAL (CORRIGIDO)
        // ==========================================================
        const App = () => {
            // ESTADOS (Hooks devem ficar sempre no topo)
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('chamada');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);

            const [formData, setFormData] = useState({
                professor: '',
                dataAula: new Date().toISOString().split('T')[0],
                ano: 2026,
                semestre: 1,
                turma: ''
            });

            const [alunos, setAlunos] = useState([]);
            const [turmaCarregada, setTurmaCarregada] = useState(false);
            const [visitantes, setVisitantes] = useState([]);
            const [novoVisitanteNome, setNovoVisitanteNome] = useState('');
            const [professores, setProfessores] = useState([]);
            const [alunosAtivosDisponiveis, setAlunosAtivosDisponiveis] = useState([]);
            const [novoAlunoChamada, setNovoAlunoChamada] = useState('');
            const [dashboardData, setDashboardData] = useState(null);
            const [turmaFiltro, setTurmaFiltro] = useState(TURMAS[0]);
            const [ordenarAlunosAZ, setOrdenarAlunosAZ] = useState(false);
            const [dataInicio, setDataInicio] = useState('');
            const [dataFim, setDataFim] = useState('');

            const chartGeralRef = useRef(null);
            const chartGeralInstance = useRef(null);
            const chartRankingRef = useRef(null);
            const chartRankingInstance = useRef(null);
            const chartTurmaRef = useRef(null);
            const chartTurmaInstance = useRef(null);
            const chartVisitantesRef = useRef(null);
            const chartVisitantesInstance = useRef(null);
            const chartProfessoresRef = useRef(null);
            const chartProfessoresInstance = useRef(null);

            // FUNÇÕES DE LÓGICA
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                if (name === 'turma') {
                    setAlunos([]);
                    setVisitantes([]);
                    setTurmaCarregada(false);
                    setNovoAlunoChamada('');
                }
            };

            const carregarAlunos = async () => {
                if (!formData.turma) {
                    setMessage({ type: 'error', text: 'Selecione uma turma.' });
                    return;
                }

                setLoading(true);
                setMessage(null);
                setAlunos([]);
                setVisitantes([]);
                setTurmaCarregada(false);

                try {
                    const [resAlunos, resVisitantes] = await Promise.all([
                        fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: "buscar_alunos", turma: formData.turma })
                        }),
                        fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: "buscar_visitantes", turma: formData.turma })
                        })
                    ]);

                    const data = await resAlunos.json();
                    const dataVisitantes = await resVisitantes.json();

                    if (data.alunos && Array.isArray(data.alunos)) {
                        if (data.alunos.length > 0) {
                            setAlunos(data.alunos.map(nome => ({ nome, presente: true })));
                        } else {
                            setMessage({ type: 'info', text: 'Nenhum aluno nesta turma.' });
                        }
                    } else {
                         setMessage({ type: 'info', text: 'Nenhum dado encontrado ou erro.' });
                    }

                    if (dataVisitantes.visitantes && Array.isArray(dataVisitantes.visitantes)) {
                        setVisitantes(dataVisitantes.visitantes.map(v => ({ nome: v.nome, presente: true })));
                    }

                    setTurmaCarregada(true);
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoading(false);
                }
            };

            const togglePresenca = (index) => {
                setAlunos(prev => prev.map((aluno, i) =>
                    i === index ? { ...aluno, presente: !aluno.presente } : aluno
                ));
            };

            const togglePresencaVisitante = (index) => {
                setVisitantes(prev => prev.map((v, i) =>
                    i === index ? { ...v, presente: !v.presente } : v
                ));
            };

            const adicionarVisitante = async () => {
                const nome = novoVisitanteNome.trim();
                if (!formData.turma) {
                    setMessage({ type: 'error', text: 'Selecione uma turma primeiro.' });
                    return;
                }
                if (!nome) {
                    setMessage({ type: 'error', text: 'Digite o nome do visitante.' });
                    return;
                }

                setLoading(true);
                setMessage(null);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "matricular_visitante", turma: formData.turma, nome })
                    });
                    const data = await res.json();
                    if (data.result === 'success') {
                        setVisitantes(prev => [...prev, { nome, presente: true }]);
                        setNovoVisitanteNome('');
                    } else {
                        setMessage({ type: 'error', text: data.error || 'Erro ao adicionar visitante.' });
                    }
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoading(false);
                }
            };

            const removerVisitante = async (nome) => {
                if (!window.confirm(`Remover "${nome}" da lista de visitantes desta turma?`)) return;
                setLoading(true);
                setMessage(null);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "desmatricular_visitante", turma: formData.turma, nome })
                    });
                    const data = await res.json();
                    if (data.result === 'success') {
                        setVisitantes(prev => prev.filter(v => v.nome !== nome));
                    } else {
                        setMessage({ type: 'error', text: data.error || 'Erro ao remover visitante.' });
                    }
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoading(false);
                }
            };

            const adicionarAlunoNaChamada = async () => {
                const nome = novoAlunoChamada.trim();
                if (!formData.turma) {
                    setMessage({ type: 'error', text: 'Selecione uma turma primeiro.' });
                    return;
                }
                if (!nome) {
                    setMessage({ type: 'error', text: 'Selecione um aluno para adicionar.' });
                    return;
                }

                setLoading(true);
                setMessage(null);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "matricular_aluno", turma: formData.turma, nomeAluno: nome })
                    });
                    const data = await res.json();
                    if (data.result === 'success') {
                        setAlunos(prev => [...prev, { nome, presente: true }].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')));
                        setNovoAlunoChamada('');
                        await carregarAlunosAtivosDisponiveis();
                    } else {
                        setMessage({ type: 'error', text: data.error || 'Erro ao adicionar aluno.' });
                    }
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoading(false);
                }
            };

            const removerAlunoDaChamada = async (nome) => {
                if (!window.confirm(`Remover "${nome}" desta turma? O histórico de chamadas dele é mantido.`)) return;

                setLoading(true);
                setMessage(null);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "desmatricular_aluno", turma: formData.turma, nomeAluno: nome })
                    });
                    const data = await res.json();
                    if (data.result === 'success') {
                        setAlunos(prev => prev.filter(aluno => aluno.nome !== nome));
                        await carregarAlunosAtivosDisponiveis();
                    } else {
                        setMessage({ type: 'error', text: data.error || 'Erro ao remover aluno.' });
                    }
                } catch (error) {
                    console.error(error);
                    setMessage({ type: 'error', text: 'Erro de conexão. Verifique o link.' });
                } finally {
                    setLoading(false);
                }
            };

            const salvarChamada = async () => {
                if (!formData.professor) {
                    setMessage({ type: 'error', text: 'Selecione um professor.' });
                    return;
                }

                setLoading(true);
                setMessage({ type: 'info', text: 'Salvando...' });

                const payload = {
                    action: "salvar_chamada",
                    ...formData,
                    listaPresenca: alunos.map(a => ({
                        aluno: a.nome,
                        status: a.presente ? "Presente" : "Ausente"
                    })),
                    listaPresencaVisitantes: visitantes.map(v => ({
                        nome: v.nome,
                        status: v.presente ? "Presente" : "Ausente"
                    }))
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    setMessage({ type: 'success', text: 'Chamada Salva!' });
                    setAlunos([]);
                    setVisitantes([]);
                    setTurmaCarregada(false);
                    setFormData(prev => ({...prev, turma: ''}));
                    setTimeout(() => setMessage(null), 3000);
                } catch (error) {
                    setMessage({ type: 'error', text: 'Erro ao salvar.' });
                } finally {
                    setLoading(false);
                }
            };

            const carregarDashboard = async () => {
                setLoading(true);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "get_dashboard" })
                    });
                    const data = await res.json();
                    if(data.result === 'success') setDashboardData(data);
                } catch (error) {
                    console.error(error);
                } finally {
                    setLoading(false);
                }
            };

            const carregarProfessores = async () => {
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "buscar_professores" })
                    });
                    const data = await res.json();
                    if (data.result === 'success' && Array.isArray(data.professores)) {
                        setProfessores(data.professores);
                    }
                } catch (error) {
                    console.error(error);
                }
            };

            const carregarAlunosAtivosDisponiveis = async () => {
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "buscar_alunos_ativos" })
                    });
                    const data = await res.json();
                    if (data.result === 'success' && Array.isArray(data.alunos)) {
                        setAlunosAtivosDisponiveis(data.alunos);
                    }
                } catch (error) {
                    console.error(error);
                }
            };

            // --- VALORES DERIVADOS (memorizados) ---

            // true se a data (yyyy-MM-dd) está dentro do intervalo escolhido pelo professor
            const dentroIntervalo = (dataKey) => {
                if (dataInicio && dataKey < dataInicio) return false;
                if (dataFim && dataKey > dataFim) return false;
                return true;
            };

            const historicoGeralFiltrado = useMemo(() => {
                if (!dashboardData || !dashboardData.historicoGeral) return dashboardData ? dashboardData.historicoGeral : undefined;
                return dashboardData.historicoGeral.filter(h => dentroIntervalo(h.data));
            }, [dashboardData, dataInicio, dataFim]);

            const historicoTurmaFiltrado = useMemo(() => {
                const historico = dashboardData && dashboardData.historicoPorTurma && dashboardData.historicoPorTurma[turmaFiltro];
                if (!historico) return historico;
                return historico.filter(h => dentroIntervalo(h.data));
            }, [dashboardData, turmaFiltro, dataInicio, dataFim]);

            const totaisGerais = useMemo(() => {
                if (dashboardData && dashboardData.historicoGeral) {
                    let presentes = 0, ausentes = 0, total = 0;
                    (historicoGeralFiltrado || []).forEach(h => { presentes += h.presentes; ausentes += h.ausentes; total += h.total; });
                    return { presentes, ausentes, total };
                }
                // Backend antigo sem historicoGeral: usa os totais agregados (sem filtro de data)
                if (!dashboardData || !dashboardData.statsPorTurma) return { presentes: 0, ausentes: 0, total: 0 };
                let presentes = 0, ausentes = 0, total = 0;
                Object.values(dashboardData.statsPorTurma).forEach(s => {
                    presentes += s.presentes; ausentes += s.ausentes; total += s.total;
                });
                return { presentes, ausentes, total };
            }, [dashboardData, historicoGeralFiltrado]);

            const rankingTurmas = useMemo(() => {
                if (!dashboardData || !dashboardData.statsPorTurma) return [];
                return Object.keys(dashboardData.statsPorTurma).map(turma => {
                    const s = dashboardData.statsPorTurma[turma];
                    const historicoTurma = dashboardData.historicoPorTurma && dashboardData.historicoPorTurma[turma];

                    if (historicoTurma) {
                        const filtrado = historicoTurma.filter(h => dentroIntervalo(h.data));
                        let presentes = 0, ausentes = 0, total = 0;
                        filtrado.forEach(h => { presentes += h.presentes; ausentes += h.ausentes; total += h.total; });
                        return {
                            turma,
                            alunos: s.alunos,
                            total,
                            domingosRegistrados: filtrado.length,
                            percentual: total > 0 ? (presentes / total * 100) : 0
                        };
                    }

                    // Backend antigo sem historicoPorTurma: usa os totais agregados (sem filtro de data)
                    return {
                        turma,
                        alunos: s.alunos,
                        total: s.total,
                        domingosRegistrados: 0,
                        percentual: s.total > 0 ? (s.presentes / s.total * 100) : 0
                    };
                }).sort((a, b) => b.percentual - a.percentual);
            }, [dashboardData, dataInicio, dataFim]);

            const mapaFaltasPivot = useMemo(() => {
                if (!dashboardData || !dashboardData.mapaAlunosPorTurma) return null;
                const registros = dashboardData.mapaAlunosPorTurma[turmaFiltro];
                if (!registros) return { alunosList: [], datasList: [], statusMap: {}, resumoAlunos: {} };

                const alunosList = [];
                const alunosSet = new Set();
                const datasSet = new Set();
                const statusMap = {};
                const resumoAlunos = {};
                registros.filter(r => dentroIntervalo(r.data)).forEach(r => {
                    if (!alunosSet.has(r.aluno)) {
                        alunosSet.add(r.aluno);
                        alunosList.push(r.aluno);
                    }
                    datasSet.add(r.data);
                    statusMap[`${r.aluno}|${r.data}`] = r.status;
                    if (!resumoAlunos[r.aluno]) {
                        resumoAlunos[r.aluno] = { total: 0, presentes: 0 };
                    }
                    resumoAlunos[r.aluno].total++;
                    if (r.status === 'Presente') {
                        resumoAlunos[r.aluno].presentes++;
                    }
                });
                return {
                    alunosList: ordenarAlunosAZ ? [...alunosList].sort((a, b) => a.localeCompare(b, 'pt-BR')) : alunosList,
                    datasList: Array.from(datasSet).sort(),
                    statusMap,
                    resumoAlunos
                };
            }, [dashboardData, turmaFiltro, dataInicio, dataFim, ordenarAlunosAZ]);

            const historicoVisitantesGeralFiltrado = useMemo(() => {
                if (!dashboardData || !dashboardData.historicoVisitantesGeral) return dashboardData ? dashboardData.historicoVisitantesGeral : undefined;
                return dashboardData.historicoVisitantesGeral.filter(h => dentroIntervalo(h.data));
            }, [dashboardData, dataInicio, dataFim]);

            const visitasNoPeriodo = useMemo(() => {
                return (historicoVisitantesGeralFiltrado || []).reduce((soma, h) => soma + h.presentes, 0);
            }, [historicoVisitantesGeralFiltrado]);

            const visitantesRecorrentesNoPeriodo = useMemo(() => {
                if (!dashboardData || !dashboardData.mapaVisitantesPorTurma) return 0;
                const contagem = {};
                Object.keys(dashboardData.mapaVisitantesPorTurma).forEach(turma => {
                    dashboardData.mapaVisitantesPorTurma[turma].forEach(r => {
                        if (r.status === 'Presente' && dentroIntervalo(r.data)) {
                            const chave = `${turma}|${r.nome}`;
                            contagem[chave] = (contagem[chave] || 0) + 1;
                        }
                    });
                });
                return Object.values(contagem).filter(n => n > 1).length;
            }, [dashboardData, dataInicio, dataFim]);

            // Última visita de cada visitante, independente do filtro de período -
            // útil pra acompanhamento pastoral mesmo olhando um semestre passado.
            const contatosVisitantes = useMemo(() => {
                if (!dashboardData || !dashboardData.mapaVisitantesPorTurma) return null;
                const porPessoa = {};
                Object.keys(dashboardData.mapaVisitantesPorTurma).forEach(turma => {
                    dashboardData.mapaVisitantesPorTurma[turma].forEach(r => {
                        if (r.status !== 'Presente') return;
                        const chave = `${turma}|${r.nome}`;
                        if (!porPessoa[chave] || r.data > porPessoa[chave].ultimaVisita) {
                            porPessoa[chave] = { nome: r.nome, turma, ultimaVisita: r.data };
                        }
                    });
                });
                return Object.values(porPessoa).sort((a, b) => b.ultimaVisita.localeCompare(a.ultimaVisita));
            }, [dashboardData]);

            const professoresNoPeriodo = useMemo(() => {
                if (!dashboardData || !dashboardData.aulasPorProfessor) return [];

                const resumo = {};
                dashboardData.aulasPorProfessor
                    .filter(aula => dentroIntervalo(aula.data))
                    .forEach(aula => {
                        if (!resumo[aula.professor]) {
                            resumo[aula.professor] = {
                                professor: aula.professor,
                                aulasDadas: 0,
                                turmasSet: new Set(),
                                presentes: 0,
                                ausentes: 0,
                                total: 0
                            };
                        }
                        resumo[aula.professor].aulasDadas++;
                        resumo[aula.professor].turmasSet.add(aula.turma);
                        resumo[aula.professor].presentes += aula.presentes;
                        resumo[aula.professor].ausentes += aula.ausentes;
                        resumo[aula.professor].total += aula.total;
                    });

                return Object.values(resumo)
                    .map(item => ({
                        professor: item.professor,
                        aulasDadas: item.aulasDadas,
                        turmas: item.turmasSet.size,
                        presentes: item.presentes,
                        ausentes: item.ausentes,
                        total: item.total,
                        percentualPresenca: item.total > 0 ? (item.presentes / item.total * 100) : 0
                    }))
                    .sort((a, b) => b.aulasDadas - a.aulasDadas || a.professor.localeCompare(b.professor, 'pt-BR'));
            }, [dashboardData, dataInicio, dataFim]);

            const resumoProfessores = useMemo(() => {
                const professoresComAulas = professoresNoPeriodo.length;
                const totalAulas = professoresNoPeriodo.reduce((soma, p) => soma + p.aulasDadas, 0);
                const mediaAulas = professoresComAulas > 0 ? totalAulas / professoresComAulas : 0;
                const mediaPresenca = totalAulas > 0
                    ? professoresNoPeriodo.reduce((soma, p) => soma + p.presentes, 0) /
                      professoresNoPeriodo.reduce((soma, p) => soma + p.total, 0) * 100
                    : 0;
                const destaque = professoresNoPeriodo[0];

                return {
                    professoresComAulas,
                    totalAulas,
                    mediaAulas,
                    mediaPresenca,
                    destaque
                };
            }, [professoresNoPeriodo]);

            const alunosDisponiveisParaChamada = useMemo(() => {
                const alunosNaTurma = new Set(alunos.map(aluno => aluno.nome));
                return alunosAtivosDisponiveis.filter(nome => !alunosNaTurma.has(nome));
            }, [alunosAtivosDisponiveis, alunos]);

            // --- HOOKS (EFEITOS) NO TOPO ---
            // IMPORTANTE: Eles devem ser declarados ANTES de qualquer "return"

            useEffect(() => {
                if (isLoggedIn) {
                    carregarProfessores();
                    carregarAlunosAtivosDisponiveis();
                }
            }, [isLoggedIn]);

            useEffect(() => {
                // Só carrega dashboard se estiver logado e na aba certa
                if (isLoggedIn && activeTab === 'dashboard') {
                    carregarDashboard();
                }
            }, [activeTab, isLoggedIn]);

            // Gráfico: Evolução Geral por Domingo (linha % + barras de total)
            useEffect(() => {
                const historico = historicoGeralFiltrado;
                if (isLoggedIn && activeTab === 'dashboard' && historico && historico.length > 0 && chartGeralRef.current) {
                    if (chartGeralInstance.current) chartGeralInstance.current.destroy();

                    const labels = historico.map(h => formatarDataCurta(h.data));
                    const percentuais = historico.map(h => h.total > 0 ? +(h.presentes / h.total * 100).toFixed(1) : 0);
                    const totais = historico.map(h => h.total);

                    chartGeralInstance.current = new Chart(chartGeralRef.current, {
                        data: {
                            labels,
                            datasets: [
                                { type: 'bar', label: 'Total de Chamadas', data: totais, backgroundColor: '#c7d2fe', borderRadius: 4, yAxisID: 'yTotal', order: 2 },
                                { type: 'line', label: '% Presença', data: percentuais, borderColor: '#4f46e5', backgroundColor: '#4f46e5', tension: 0.3, yAxisID: 'yPct', order: 1 }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            scales: {
                                yPct: { type: 'linear', position: 'left', min: 0, max: 100, ticks: { callback: v => v + '%' } },
                                yTotal: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
                            }
                        }
                    });
                }
            }, [historicoGeralFiltrado, activeTab, isLoggedIn]);

            // Gráfico: Ranking de Turmas (barras horizontais por % de presença)
            useEffect(() => {
                if (isLoggedIn && activeTab === 'dashboard' && rankingTurmas.length > 0 && chartRankingRef.current) {
                    if (chartRankingInstance.current) chartRankingInstance.current.destroy();

                    chartRankingInstance.current = new Chart(chartRankingRef.current, {
                        type: 'bar',
                        data: {
                            labels: rankingTurmas.map(r => r.turma),
                            datasets: [{
                                label: '% Presença',
                                data: rankingTurmas.map(r => +r.percentual.toFixed(1)),
                                backgroundColor: '#4f46e5',
                                borderRadius: 5
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: { x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } },
                            plugins: {
                                tooltip: {
                                    callbacks: {
                                        afterLabel: (ctx) => `${rankingTurmas[ctx.dataIndex].alunos} alunos ativos`
                                    }
                                }
                            }
                        }
                    });
                }
            }, [rankingTurmas, activeTab, isLoggedIn]);

            // Gráfico: Evolução por Turma (filtrado por turma e por intervalo de datas)
            useEffect(() => {
                const historico = historicoTurmaFiltrado;
                if (isLoggedIn && activeTab === 'dashboard' && historico && historico.length > 0 && chartTurmaRef.current) {
                    if (chartTurmaInstance.current) chartTurmaInstance.current.destroy();

                    const labels = historico.map(h => formatarDataCurta(h.data));
                    const percentuais = historico.map(h => h.total > 0 ? +(h.presentes / h.total * 100).toFixed(1) : 0);
                    const totais = historico.map(h => h.total);

                    chartTurmaInstance.current = new Chart(chartTurmaRef.current, {
                        data: {
                            labels,
                            datasets: [
                                { type: 'bar', label: 'Total de Chamadas', data: totais, backgroundColor: '#a7f3d0', borderRadius: 4, yAxisID: 'yTotal', order: 2 },
                                { type: 'line', label: '% Presença', data: percentuais, borderColor: '#059669', backgroundColor: '#059669', tension: 0.3, yAxisID: 'yPct', order: 1 }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            scales: {
                                yPct: { type: 'linear', position: 'left', min: 0, max: 100, ticks: { callback: v => v + '%' } },
                                yTotal: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
                            }
                        }
                    });
                } else if (chartTurmaInstance.current) {
                    chartTurmaInstance.current.destroy();
                    chartTurmaInstance.current = null;
                }
            }, [historicoTurmaFiltrado, activeTab, isLoggedIn]);

            // Gráfico: Evolução de Visitantes por Domingo
            useEffect(() => {
                const historico = historicoVisitantesGeralFiltrado;
                if (isLoggedIn && activeTab === 'dashboard' && historico && historico.length > 0 && chartVisitantesRef.current) {
                    if (chartVisitantesInstance.current) chartVisitantesInstance.current.destroy();

                    const labels = historico.map(h => formatarDataCurta(h.data));
                    const visitas = historico.map(h => h.presentes);

                    chartVisitantesInstance.current = new Chart(chartVisitantesRef.current, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{ label: 'Visitas', data: visitas, backgroundColor: '#f59e0b', borderRadius: 4 }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                        }
                    });
                }
            }, [historicoVisitantesGeralFiltrado, activeTab, isLoggedIn]);

            useEffect(() => {
                if (isLoggedIn && activeTab === 'dashboard' && professoresNoPeriodo.length > 0 && chartProfessoresRef.current) {
                    if (chartProfessoresInstance.current) chartProfessoresInstance.current.destroy();

                    const topProfessores = professoresNoPeriodo.slice(0, 8);
                    chartProfessoresInstance.current = new Chart(chartProfessoresRef.current, {
                        type: 'bar',
                        data: {
                            labels: topProfessores.map(p => p.professor),
                            datasets: [
                                {
                                    label: 'Aulas dadas',
                                    data: topProfessores.map(p => p.aulasDadas),
                                    backgroundColor: '#0f766e',
                                    borderRadius: 6
                                },
                                {
                                    type: 'line',
                                    label: '% presença',
                                    data: topProfessores.map(p => +p.percentualPresenca.toFixed(1)),
                                    borderColor: '#f59e0b',
                                    backgroundColor: '#f59e0b',
                                    tension: 0.3,
                                    yAxisID: 'yPct'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { beginAtZero: true, ticks: { precision: 0 } },
                                yPct: { type: 'linear', position: 'right', min: 0, max: 100, grid: { drawOnChartArea: false }, ticks: { callback: v => v + '%' } }
                            }
                        }
                    });
                } else if (chartProfessoresInstance.current) {
                    chartProfessoresInstance.current.destroy();
                    chartProfessoresInstance.current = null;
                }
            }, [professoresNoPeriodo, activeTab, isLoggedIn]);


            // --- RENDERIZAÇÃO CONDICIONAL ---
            // Agora que todos os hooks foram declarados, podemos retornar a tela de login
            if (!isLoggedIn) {
                return <LoginScreen onLogin={() => setIsLoggedIn(true)} />;
            }

            // --- TELA PRINCIPAL (APÓS LOGIN) ---
            return (
                <div className="flex flex-col min-h-screen fade-in">
                    {/* Header */}
                    <header className="bg-indigo-700 text-white p-6 shadow-lg relative overflow-hidden">
                        <div className="absolute inset-0 bg-indigo-900/30"></div>
                        <div className="relative z-10 max-w-3xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black tracking-tight flex items-center gap-2">
                                    <Icon name="book-open" className="w-8 h-8 text-indigo-300" />
                                    EBD Digital
                                </h1>
                                <p className="text-indigo-100 text-sm font-medium mt-1 pl-10">PIPP - Planaltina DF</p>
                            </div>
                            <button onClick={() => setIsLoggedIn(false)} className="bg-indigo-800 p-2 rounded-lg hover:bg-indigo-900 transition text-xs font-bold uppercase flex items-center gap-2">
                                <Icon name="log-out" className="w-4 h-4" /> Sair
                            </button>
                        </div>
                    </header>

                    <main className={`mx-auto px-4 -mt-6 w-full flex-grow relative z-20 pb-12 transition-all ${activeTab === 'dashboard' ? 'max-w-6xl' : 'max-w-3xl'}`}>

                        {/* Abas */}
                        <div className="flex bg-white p-1 rounded-2xl shadow-lg mb-6 border border-slate-100">
                            <button onClick={() => setActiveTab('chamada')} className={`flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${activeTab === 'chamada' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="check-circle" className="w-5 h-5" /> Chamada
                            </button>
                            <button onClick={() => setActiveTab('dashboard')} className={`flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="bar-chart-2" className="w-5 h-5" /> Estatísticas
                            </button>
                        </div>

                        {/* Mensagens */}
                        {message && (
                            <div className={`mb-6 p-4 rounded-xl flex items-center gap-3 border ${message.type === 'error' ? 'bg-red-50 text-red-700 border-red-100' : message.type === 'success' ? 'bg-green-50 text-green-700 border-green-100' : 'bg-blue-50 text-blue-700 border-blue-100'}`}>
                                <span className="font-bold">{message.text}</span>
                            </div>
                        )}

                        {/* Chamada */}
                        {activeTab === 'chamada' && (
                            <div className="fade-in space-y-6">
                                <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                                    <div className="flex items-center gap-2 mb-6 text-indigo-900 border-b border-slate-100 pb-2">
                                        <Icon name="settings" className="w-5 h-5" />
                                        <h2 className="font-black text-lg uppercase">Configuração</h2>
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase ml-1">Data</label>
                                            <input type="date" name="dataAula" value={formData.dataAula} onChange={handleInputChange} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 mt-1 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase ml-1">Professor</label>
                                            <select name="professor" value={formData.professor} onChange={handleInputChange} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 mt-1 font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
                                                <option value="">Selecione um professor</option>
                                                {professores.map((prof) => (
                                                    <option key={prof} value={prof}>{prof}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" name="ano" value={formData.ano} onChange={handleInputChange} className="bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-center font-bold" />
                                            <select name="semestre" value={formData.semestre} onChange={handleInputChange} className="bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 font-bold text-center">
                                                <option value="1">1º Sem</option>
                                                <option value="2">2º Sem</option>
                                            </select>
                                        </div>
                                        <div>
                                            <select name="turma" value={formData.turma} onChange={handleInputChange} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
                                                <option value="">Selecione a Turma...</option>
                                                {TURMAS.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <button onClick={carregarAlunos} disabled={loading} className="w-full mt-6 bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow hover:bg-indigo-700 transition-colors flex justify-center items-center gap-2">
                                        {loading ? "Carregando..." : <><Icon name="search" className="w-4 h-4" /> Buscar Alunos</>}
                                    </button>
                                </div>

                                {turmaCarregada && (
                                    <>
                                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 fade-in border-l-4 border-l-indigo-500">
                                            <div className="flex justify-between items-center mb-6">
                                                <h3 className="font-black text-lg text-slate-800">Lista de Presença</h3>
                                                <span className="text-xs font-bold bg-slate-100 px-3 py-1 rounded-full">{alunos.length} Alunos</span>
                                            </div>
                                            {alunos.length > 0 ? (
                                                <>
                                                    <div className="mb-3 grid grid-cols-[minmax(0,1fr)_auto_auto] gap-3 px-4 text-xs font-bold uppercase tracking-wider text-slate-400">
                                                        <span>Aluno</span>
                                                        <span className="text-center">Presença</span>
                                                        <span className="text-center">Excluir</span>
                                                    </div>
                                                    <div className="space-y-3">
                                                        {alunos.map((aluno, idx) => (
                                                            <div key={idx} className={`flex items-center justify-between p-4 rounded-2xl border ${aluno.presente ? 'bg-indigo-50 border-indigo-200' : 'bg-slate-50 border-slate-100 opacity-60'}`}>
                                                                <span className={`font-bold text-sm ${aluno.presente ? 'text-indigo-900' : 'text-slate-500'}`}>{aluno.nome}</span>
                                                                <div className="flex items-center gap-4">
                                                                    <div className="relative inline-block w-12 h-6 align-middle select-none">
                                                                        <input type="checkbox" checked={aluno.presente} onChange={() => togglePresenca(idx)} className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0 top-0 border-slate-300 shadow-sm" style={{right: aluno.presente ? '0' : 'auto', left: aluno.presente ? 'auto' : '0', borderColor: aluno.presente ? '#4f46e5' : '#e2e8f0'}} />
                                                                        <div className={`block overflow-hidden h-6 rounded-full cursor-pointer transition-colors duration-300 ${aluno.presente ? 'bg-indigo-600' : 'bg-slate-300'}`}></div>
                                                                    </div>
                                                                    <button onClick={() => removerAlunoDaChamada(aluno.nome)} disabled={loading} className="text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition-colors">
                                                                        <Icon name="trash-2" className="w-4 h-4" />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </>
                                            ) : (
                                                <AvisoVazio texto="Nenhum aluno nesta turma ainda." />
                                            )}
                                            <div className="border-t border-slate-100 pt-4 mt-6">
                                                <p className="text-xs font-bold text-slate-500 uppercase mb-3">Adicionar Aluno na Turma</p>
                                                <div className="grid sm:grid-cols-[1fr_auto] gap-2">
                                                    <select
                                                        value={novoAlunoChamada}
                                                        onChange={(e) => setNovoAlunoChamada(e.target.value)}
                                                        className="bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-4 font-medium focus:ring-2 focus:ring-indigo-500 outline-none"
                                                    >
                                                        <option value="">Selecione um aluno ativo</option>
                                                        {alunosDisponiveisParaChamada.map((nome) => (
                                                            <option key={nome} value={nome}>{nome}</option>
                                                        ))}
                                                    </select>
                                                    <button onClick={adicionarAlunoNaChamada} disabled={loading || !novoAlunoChamada} className="bg-indigo-600 text-white font-bold px-5 rounded-xl shadow hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2 disabled:opacity-50">
                                                        <Icon name="user-plus" className="w-4 h-4" /> Adicionar
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Visitantes */}
                                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 fade-in border-l-4 border-l-amber-400">
                                            <div className="flex justify-between items-center mb-6">
                                                <h3 className="font-black text-lg text-slate-800">Visitantes</h3>
                                                <span className="text-xs font-bold bg-slate-100 px-3 py-1 rounded-full">{visitantes.length} Visitante{visitantes.length === 1 ? '' : 's'}</span>
                                            </div>

                                            {visitantes.length > 0 && (
                                                <div className="space-y-3 mb-6">
                                                    {visitantes.map((v, idx) => (
                                                        <div key={idx} className={`flex items-center justify-between p-4 rounded-2xl border ${v.presente ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-100 opacity-60'}`}>
                                                            <div>
                                                                <p className={`font-bold text-sm ${v.presente ? 'text-amber-900' : 'text-slate-500'}`}>{v.nome}</p>
                                                            </div>
                                                            <div className="flex items-center gap-3">
                                                                <div className="relative inline-block w-12 h-6 align-middle select-none">
                                                                    <input type="checkbox" checked={v.presente} onChange={() => togglePresencaVisitante(idx)} className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0 top-0 border-slate-300 shadow-sm" style={{right: v.presente ? '0' : 'auto', left: v.presente ? 'auto' : '0', borderColor: v.presente ? '#f59e0b' : '#e2e8f0'}} />
                                                                    <div className={`block overflow-hidden h-6 rounded-full cursor-pointer transition-colors duration-300 ${v.presente ? 'bg-amber-500' : 'bg-slate-300'}`}></div>
                                                                </div>
                                                                <button onClick={() => removerVisitante(v.nome)} disabled={loading} className="text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition-colors">
                                                                    <Icon name="x" className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            <div className="border-t border-slate-100 pt-4">
                                                <p className="text-xs font-bold text-slate-500 uppercase mb-3">Adicionar Visitante</p>
                                                <div className="grid sm:grid-cols-[1fr_auto] gap-2">
                                                    <input
                                                        type="text"
                                                        value={novoVisitanteNome}
                                                        onChange={(e) => setNovoVisitanteNome(e.target.value)}
                                                        placeholder="Nome completo"
                                                        className="bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-4 focus:ring-2 focus:ring-amber-400 outline-none"
                                                    />
                                                    <button onClick={adicionarVisitante} disabled={loading || !novoVisitanteNome.trim()} className="bg-amber-500 text-white font-bold px-5 rounded-xl shadow hover:bg-amber-600 transition-colors flex items-center justify-center gap-2 disabled:opacity-50">
                                                        <Icon name="user-plus" className="w-4 h-4" /> Adicionar
                                                    </button>
                                                </div>
                                            </div>

    <!-- DETECTOR DE TELA BRANCA: roda em JS puro (nao depende do Babel/React) -->
    <script>
        function mostrarDiagnostico() {
            var root = document.getElementById('root');
            if (root && root.children.length > 0) return; // app montou: nada a fazer

            var faltando = [];
            if (typeof React === 'undefined') faltando.push('React');
            if (typeof ReactDOM === 'undefined') faltando.push('React DOM');
            if (typeof Babel === 'undefined') faltando.push('Babel');

            var msg = '';
            if (window.__falhasDeCarregamento && window.__falhasDeCarregamento.length) {
                msg += '<p><strong>Estas bibliotecas nao carregaram:</strong></p><ul style="margin:8px 0 0 18px">';
                window.__falhasDeCarregamento.forEach(function (f) { msg += '<li>' + f + '</li>'; });
                msg += '</ul>';
            } else if (faltando.length) {
                msg += '<p><strong>Bibliotecas indisponiveis:</strong> ' + faltando.join(', ') + '</p>';
            }
            if (window.__erroDeExecucao) {
                msg += '<p style="margin-top:12px"><strong>Erro de execucao:</strong></p>'
                     + '<pre style="white-space:pre-wrap;background:#0f172a;color:#fca5a5;padding:12px;border-radius:8px;font-size:12px;overflow:auto">'
                     + String(window.__erroDeExecucao).replace(/</g, '&lt;') + '</pre>';
            }
            if (!msg) {
                msg = '<p>Os scripts demoraram demais para responder ou foram bloqueados.</p>';
            }

            root.innerHTML =
                '<div style="max-width:640px;margin:48px auto;padding:28px;font-family:system-ui,sans-serif;'
              + 'background:#fff;border:1px solid #e2e8f0;border-left:6px solid #dc2626;border-radius:16px;'
              + 'box-shadow:0 10px 30px rgba(0,0,0,.06);color:#1e293b">'
              + '<h2 style="margin:0 0 6px;color:#dc2626;font-size:18px">Nao foi possivel carregar a pagina</h2>'
              + '<p style="margin:0 0 14px;color:#64748b;font-size:14px">O codigo esta correto, mas os recursos abaixo nao puderam ser baixados:</p>'
              + msg
              + '<p style="margin-top:18px;font-size:13px;color:#475569"><strong>Como resolver:</strong></p>'
              + '<ul style="margin:6px 0 0 18px;font-size:13px;color:#475569;line-height:1.6">'
              + '<li>Verifique sua conexao com a internet e recarregue (F5).</li>'
              + '<li>Desative bloqueadores de anuncios/scripts para esta pagina.</li>'
              + '<li>Em rede corporativa/escolar, o acesso a <code>unpkg.com</code> ou <code>jsdelivr.net</code> pode estar bloqueado - tente outra rede.</li>'
              + '</ul></div>';
        }
        window.addEventListener('load', function () { setTimeout(mostrarDiagnostico, 2500); });
    </script>
